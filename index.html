
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loto Athletic 89 FC</title>

<style>
* {
  box-sizing: border-box;
}

@font-face {
  font-family: 'Barlow Condensed';
  src: url('./fonts/barlow-condensed-regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Barlow Condensed';
  src: url('./fonts/barlow-condensed-900.woff2') format('woff2');
  font-weight: 900;
  font-style: normal;
  font-display: swap;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  background: #183047;
  color: #f1f4f8;
}

main {
  display: grid;
  grid-template-columns: 40% 60%;
  width: 100%;
  height: 100vh;
  height: 100dvh;
}

.panel {
  min-width: 0;
  min-height: 0;
}

.grille {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  grid-template-rows: repeat(9, minmax(0, 1fr));
  width: 100%;
  height: 100%;
}

.numero {
  min-width: 0;
  min-height: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: #183047;
  color: #e8edf2;
  opacity: 0.5;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(0.7rem, 2.5vw, 2rem);
  font-weight: 900;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.numero.sorti {
  background: #16a36a;
  opacity: 1;
}

.affichage {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.boule {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 3%;
  background: #183047;
  color: white;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: min(45vw, 65vh);
  font-size: min(45cqw, 65cqh);
  font-weight: 900;
  line-height: 0.9;
  white-space: nowrap;
  overflow: hidden;
}

.logo {
  display: block;
  max-width: 90%;
  max-height: 90%;
  width: auto;
  height: auto;
  object-fit: contain;
}

@media (orientation: portrait) {
  main {
    grid-template-columns: 1fr;
    grid-template-rows: 35% 65%;
  }

  .grille {
    grid-template-columns: repeat(10, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
  }

  .numero {
    font-size: clamp(0.65rem, 2.8vw, 1.4rem);
  }

  .boule {
    font-size: min(70vw, 45vh);
  }
}
</style>
</head>

<body>
<main>
  <section class="panel">
    <div class="grille" id="grille"></div>
  </section>

  <section class="panel">
    <div class="affichage">
      <div class="boule" id="grandNumero">
        <img
          src="./athletic89f-logo-600x562.png"
          alt="Logo Athletic 89 FC"
          class="logo"
          id="logo"
        >
      </div>
    </div>
  </section>
</main>

<script>
const grille = document.getElementById("grille");
const grandNumero = document.getElementById("grandNumero");
const logo = document.getElementById("logo");

let historique = [];
let numeroActuel = null;

for (let n = 1; n <= 90; n++) {
  const bouton = document.createElement("button");
  bouton.className = "numero";
  bouton.textContent = n;
  bouton.id = "numero-" + n;
  bouton.type = "button";
  bouton.setAttribute("aria-label", "Numéro " + n);
  bouton.onclick = () => selectionner(n);
  grille.appendChild(bouton);
}

function selectionner(n) {
  if (!historique.includes(n)) {
    historique.push(n);
  }

  numeroActuel = n;
  actualiser();
}

function actualiser() {
  if (logo) {
    logo.remove();
  }

  grandNumero.textContent = numeroActuel ?? "—";

  document.querySelectorAll(".numero").forEach(bouton => {
    const n = Number(bouton.textContent);
    bouton.classList.toggle("sorti", historique.includes(n));
    bouton.classList.toggle("actuel", n === numeroActuel);
  });
}

function annuler() {
  historique.pop();
  numeroActuel = historique.length
    ? historique[historique.length - 1]
    : null;
  actualiser();
}

function reinitialiser() {
  if (confirm("Recommencer une nouvelle partie ?")) {
    historique = [];
    numeroActuel = null;
    actualiser();
  }
}
</script>
</body>
</html>
